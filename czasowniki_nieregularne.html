<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Czasowniki nieregularne — trening</title><style>
:root{color-scheme:dark;--bg:#081322;--panel:#13243b;--edge:#30465e;--text:#f4f8ff;--muted:#a9bdd2;--accent:#6ee7b7;--bad:#ff8795}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top left,#173b57,transparent 45%),var(--bg);font:16px/1.5 system-ui,sans-serif;color:var(--text)}main{max-width:900px;margin:auto;padding:25px 16px 65px}h1{margin:0;font-size:clamp(1.6rem,4vw,2.4rem)}.sub{color:var(--muted);margin:4px 0 24px}.controls,.tabs,.actions{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin:14px 0}select,button,input{font:inherit}select,button{background:#203650;color:var(--text);border:1px solid var(--edge);padding:11px 14px;border-radius:12px}button{cursor:pointer}button:hover{filter:brightness(1.15)}button.active,.primary{background:#12664e;border-color:#39c59a}button:disabled{opacity:.5;cursor:default}.panel{background:var(--panel);border:1px solid var(--edge);border-radius:20px;padding:22px;margin-top:16px}.meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted)}.prompt{font-size:clamp(1.6rem,5vw,2.7rem);font-weight:750;margin:24px 0 18px;overflow-wrap:anywhere}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field label{display:block;color:var(--muted);font-size:.9rem;margin-bottom:5px}.field input{width:100%;padding:13px;border-radius:11px;border:1px solid #58708c;background:#09192c;color:var(--text)}.field input:disabled{opacity:.8}.field input.good{border-color:#45d6a6}.field input.bad{border-color:var(--bad)}.feedback{min-height:28px;margin:15px 0;color:var(--accent);white-space:pre-line}.feedback.error{color:#ffb5bd}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.choice{min-height:60px;text-align:left}.choice.selected{border-color:var(--accent);background:#185442}.chip{display:inline-block;border:1px solid var(--edge);border-radius:10px;padding:7px 10px;background:#0a1a2c;margin:4px}.card{min-height:220px;display:grid;place-items:center;text-align:center;cursor:pointer;border:1px solid #4a6b87;border-radius:18px;background:linear-gradient(145deg,#203b5a,#10243a);padding:24px}.card .big{font-size:clamp(1.7rem,5vw,2.8rem);font-weight:800}.small{color:var(--muted);font-size:.85rem}.progress{height:9px;background:#263d56;border-radius:20px;overflow:hidden;margin:16px 0}.progress div{height:100%;background:var(--accent);width:0;transition:width .2s}.hidden{display:none!important}.tablewrap{overflow:auto;max-height:500px}table{border-collapse:collapse;width:100%;font-size:.92rem}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--edge)}th{position:sticky;top:0;background:#203650}.stats{color:var(--muted)}@media(max-width:550px){.fields,.choices{grid-template-columns:1fr}.panel{padding:16px}.controls select{flex:1}}
</style></head><body><main><h1>📚 Czasowniki nieregularne</h1><p class="sub">Dwie lekcje z Twojej tabeli • uzupełnianie, fiszki, test i łączenie</p><div class="controls"><label for="lesson">Materiał:</label><select id="lesson"><option value="1">Lekcja 1 — lewa tabela</option><option value="2">Lekcja 2 — prawa tabela</option><option value="all">Obie lekcje</option></select><button id="shuffle">🔀 Wymieszaj</button></div><div class="tabs"><button data-mode="fill" class="active">✍️ Uzupełnianka</button><button data-mode="flash">🃏 Fiszki</button><button data-mode="quiz">🎯 Test ABCD</button><button data-mode="match">🔗 Łączenie</button><button data-mode="list">📋 Lista</button></div><div class="panel"><div class="meta"><span id="status"></span><span id="score"></span></div><div class="progress"><div id="bar"></div></div><div id="content"></div><div id="feedback" class="feedback" role="status" aria-live="polite"></div><div class="actions" id="actions"></div></div><p class="small">Postęp jest zapisywany na tym urządzeniu. W uzupełniance możesz otrzymać dowolną z 4 danych i wpisać pozostałe 3. Warianty rozdzielone ukośnikiem są akceptowane.</p></main><script>
const DATA={"1": [["be", "was/were", "been", "być"], ["beat", "beat", "beaten", "bić, pokonywać"], ["become", "became", "become", "stawać się"], ["begin", "began", "begun", "zaczynać"], ["bite", "bit", "bitten", "gryźć"], ["blow", "blew", "blown", "dmuchać, wiać"], ["break", "broke", "broken", "łamać, psuć się"], ["bring", "brought", "brought", "przynosić"], ["broadcast", "broadcast", "broadcast", "transmitować, nadawać"], ["build", "built", "built", "budować"], ["burn", "burnt", "burnt", "palić się, spłonąć"], ["buy", "bought", "bought", "kupować"], ["can", "could", "—", "móc, potrafić"], ["catch", "caught", "caught", "łapać, chwytać"], ["choose", "chose", "chosen", "wybierać"], ["come", "came", "come", "przyjść, przyjechać"], ["cost", "cost", "cost", "kosztować"], ["cut", "cut", "cut", "ciąć, rozcinać"], ["deal", "dealt", "dealt", "radzić sobie"], ["do", "did", "done", "robić, czynić"], ["draw", "drew", "drawn", "rysować"], ["dream", "dreamt", "dreamt", "śnić, marzyć"], ["drink", "drank", "drunk", "pić"], ["drive", "drove", "driven", "prowadzić, kierować"], ["eat", "ate", "eaten", "jeść"], ["fall", "fell", "fallen", "padać, upadać"], ["feed", "fed", "fed", "karmić"], ["feel", "felt", "felt", "czuć"], ["fight", "fought", "fought", "walczyć"], ["find", "found", "found", "znaleźć"], ["fly", "flew", "flown", "latać"], ["forecast", "forecast", "forecast", "prognozować"], ["forget", "forgot", "forgot/forgotten", "zapomnieć"], ["get", "got", "got/gotten", "dostawać, otrzymywać"], ["give", "gave", "given", "dawać"], ["go", "went", "gone", "iść"], ["grow", "grew", "grown", "rosnąć"], ["have", "had", "had", "mieć, posiadać"], ["hear", "heard", "heard", "słyszeć"], ["hide", "hid", "hidden", "chować, ukrywać"], ["hit", "hit", "hit", "uderzać"], ["hold", "held", "held", "trzymać"], ["hurt", "hurt", "hurt", "ranić, boleć"], ["keep", "kept", "kept", "trzymać, zachować"], ["know", "knew", "known", "wiedzieć, znać"], ["lead", "led", "led", "prowadzić, przewodniczyć"], ["learn", "learnt", "learnt", "uczyć się"], ["leave", "left", "left", "opuszczać, wyjeżdżać"]], "2": [["lend", "lent", "lent", "pożyczyć (komuś)"], ["let", "let", "let", "pozwalać"], ["lie", "lay", "lain", "leżeć"], ["light", "lit", "lit", "zapalać, oświetlać"], ["lose", "lost", "lost", "gubić, tracić"], ["mean", "meant", "meant", "mieć na myśli, znaczyć"], ["make", "made", "made", "robić"], ["meet", "met", "met", "spotykać"], ["pay", "paid", "paid", "płacić"], ["prove", "proved", "proven", "udowodnić, dowieść"], ["put", "put", "put", "kłaść"], ["read", "read", "read", "czytać"], ["ride", "rode", "ridden", "jeździć (np. rowerem, konno)"], ["ring", "rang", "rung", "dzwonić"], ["rise", "rose", "risen", "wzrastać, wstawać"], ["run", "ran", "run", "biec"], ["say", "said", "said", "powiedzieć"], ["see", "saw", "seen", "widzieć, rozumieć"], ["sell", "sold", "sold", "sprzedawać"], ["send", "sent", "sent", "wysyłać"], ["shake", "shook", "shaken", "potrząsać"], ["shine", "shone", "shone", "świecić"], ["show", "showed", "shown", "pokazywać"], ["shoot", "shot", "shot", "strzelać"], ["shut", "shut", "shut", "zamykać"], ["sing", "sang", "sung", "śpiewać"], ["sink", "sank", "sunk", "tonąć"], ["sit", "sat", "sat", "siedzieć"], ["sleep", "slept", "slept", "spać"], ["slide", "slid", "slid", "ślizgać się"], ["smell", "smelt", "smelt", "wąchać, pachnieć"], ["speak", "spoke", "spoken", "mówić"], ["speed", "sped", "sped", "pędzić, przyspieszyć"], ["spend", "spent", "spent", "wydawać (pieniądze), spędzać"], ["stand", "stood", "stood", "stać, postawić"], ["steal", "stole", "stolen", "kraść"], ["stick", "stuck", "stuck", "przyklejać"], ["stink", "stank", "stunk", "cuchnąć"], ["sweep", "swept", "swept", "zamiatać"], ["swim", "swam", "swum", "pływać"], ["take", "took", "taken", "wziąć"], ["teach", "taught", "taught", "uczyć (kogoś)"], ["tell", "told", "told", "powiedzieć"], ["think", "thought", "thought", "myśleć, sądzić"], ["throw", "threw", "thrown", "rzucać"], ["understand", "understood", "understood", "rozumieć"], ["wake", "woke", "woken", "budzić się, obudzić"], ["wear", "wore", "worn", "nosić (ubranie)"], ["win", "won", "won", "wygrywać"], ["write", "wrote", "written", "pisać"]]};
const $=id=>document.getElementById(id);let mode='fill',deck=[],idx=0,correct=0,checked=false,shown=false,sourceIndex=0,matchItems=[],matchSelected=null,matchPairs=0,matchErrors=0;
const names=['Bezokolicznik','Past Simple','Past Participle','Po polsku'];
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pool(){return $('lesson').value==='all'?[...DATA['1'],...DATA['2']]:DATA[$('lesson').value]}
function save(){try{localStorage.setItem('irregularStats',JSON.stringify({lesson:$('lesson').value,mode,correct,idx}))}catch(e){}}
function start(){deck=shuffle(pool().map(x=>[...x]));idx=0;correct=0;checked=false;shown=false;newMatch();render();save()}
function action(label,fn,cls=''){let b=document.createElement('button');b.textContent=label;b.className=cls;b.onclick=fn;$('actions').append(b);return b}
function clear(){ $('content').replaceChildren();$('actions').replaceChildren();$('feedback').textContent='';$('feedback').className='feedback';$('status').textContent='';$('score').textContent='';$('bar').style.width='0%'}
function el(tag,text,cls,parent=$('content')){let e=document.createElement(tag);if(text!==null)e.textContent=text;if(cls)e.className=cls;parent.append(e);return e}
function norm(x){return x.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’‘]/g,"'").replace(/[.,!?()]/g,'').replace(/\s+/g,' ').trim()}
function variants(x){return x.split(/\s*\/\s*/).map(norm)}
function valid(input,answer){let v=norm(input);return variants(answer).includes(v)|| (answer==='—'&&['-','—','nie ma','brak'].includes(v))|| (answer.includes(',')&&answer.split(',').some(x=>norm(x)===v))}
function newMatch(){let p=shuffle(pool().slice()).slice(0,Math.min(6,pool().length));matchItems=p.map((r,i)=>({id:i,en:r[0],pl:r[3]}));matchSelected=null;matchPairs=0;matchErrors=0}
function next(){idx++;checked=false;shown=false;render();save()}
function header(){let n=mode==='match'?matchItems.length:deck.length;$('status').textContent=mode==='list'?`${pool().length} czasowników`:mode==='match'?`Połącz pary: ${matchPairs}/${n}`:`Pytanie ${Math.min(idx+1,n)} z ${n}`;$('score').textContent=`Poprawne: ${correct}`;$('bar').style.width=(mode==='match'?matchPairs/n:idx/n)*100+'%'}
function end(){el('h2','🎉 Koniec rundy!');el('p',`Poprawne odpowiedzi: ${correct} z ${deck.length}.`);action('Jeszcze jedna runda',start,'primary');$('bar').style.width='100%'}
function render(){clear();header();if(mode==='list')return list();if(mode==='match')return matching();if(idx>=deck.length)return end();if(mode==='fill')return fill();if(mode==='flash')return flash();if(mode==='quiz')return quiz()}
function fill(){let r=deck[idx];sourceIndex=Math.floor(Math.random()*4);let p=el('div',r[sourceIndex],'prompt');p.title=names[sourceIndex];el('div','Podano: '+names[sourceIndex]+'. Wpisz pozostałe trzy formy.','small');let fields=el('div',null,'fields');let inputs=[];r.forEach((v,i)=>{if(i===sourceIndex)return;let box=el('div',null,'field',fields);let label=el('label',names[i],null,box);let input=el('input',null,null,box);input.placeholder='Wpisz odpowiedź';input.autocomplete='off';input.spellcheck=false;label.append();inputs.push({input,i,v});});let btn=action('Sprawdź odpowiedzi',()=>{if(checked)return;checked=true;let good=0;let details=[];inputs.forEach(({input,i,v})=>{let ok=valid(input.value,v);input.classList.add(ok?'good':'bad');input.disabled=true;if(ok)good++;else details.push(`${names[i]}: ${v}`)});if(good===3)correct++;$('feedback').textContent=good===3?'✅ Wszystkie trzy odpowiedzi poprawne!':`Wynik: ${good}/3. Poprawne odpowiedzi:\n${details.join('\n')}`;$('feedback').classList.toggle('error',good!==3);btn.remove();action('Następny →',next,'primary');$('score').textContent=`Poprawne: ${correct}`;save()},'primary');action('Pokaż odpowiedź',()=>{if(checked)return;inputs.forEach(({input,v})=>{input.value=v});btn.click()});inputs[0]?.input.focus();inputs.forEach(({input})=>input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!checked)btn.click()}))}
function flash(){let r=deck[idx];let card=el('div',null,'card');card.tabIndex=0;let label=el('div',null,null,card);let big=el('div',null,'big',label);let small=el('div',null,'small',label);function face(){label.replaceChildren();big=el('div',shown?`${r[0]} · ${r[1]} · ${r[2]}`:r[3],'big',label);small=el('div',shown?r[3]:'Kliknij, aby odkryć formy','small',label)}card.onclick=()=>{shown=!shown;face()};card.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();card.click()}};face();action('🔊 Wymowa',()=>speak(r[0]));action('Jeszcze ćwiczę',next);action('Umiem ✓',()=>{correct++;next()},'primary')}
function speak(t){if(!('speechSynthesis' in window))return;let u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.85;speechSynthesis.speak(u)}
function quiz(){let r=deck[idx],target=Math.floor(Math.random()*3)+1;let q=el('div',r[0],'prompt');el('div',`Wybierz: ${names[target]}`,'small');let other=shuffle(pool().filter(x=>x[0]!==r[0])).slice(0,3).map(x=>x[target]);let opts=shuffle([r[target],...other]);let area=el('div',null,'choices');opts.forEach(x=>{let b=el('button',x,'choice',area);b.onclick=()=>{if(checked)return;checked=true;let ok=x===r[target];if(ok)correct++;Array.from(area.children).forEach(k=>{k.disabled=true;if(k.textContent===r[target])k.classList.add('selected')});$('feedback').textContent=ok?'✅ Dobrze!':`❌ Poprawna odpowiedź: ${r[target]}`;$('feedback').classList.toggle('error',!ok);action('Następny →',next,'primary');$('score').textContent=`Poprawne: ${correct}`;save()}})}
function matching(){let area=el('div',null,'choices');let left=shuffle(matchItems.map(x=>({id:x.id,text:x.en,side:0})));let right=shuffle(matchItems.map(x=>({id:x.id,text:x.pl,side:1})));let picked=[];[left,right].forEach((items,side)=>{let col=el('div',null,null,area);items.forEach(x=>{let b=el('button',x.text,'choice',col);b.style.width='100%';b.style.marginBottom='8px';b.dataset.id=x.id;b.dataset.side=side;b.onclick=()=>{if(b.disabled)return;if(matchSelected&&matchSelected.side===side){matchSelected.btn.classList.remove('selected');matchSelected=null}if(!matchSelected){matchSelected={id:x.id,side,btn:b};b.classList.add('selected');return}let first=matchSelected;matchSelected=null;first.btn.classList.remove('selected');if(first.id===x.id){first.btn.disabled=true;b.disabled=true;first.btn.classList.add('selected');b.classList.add('selected');matchPairs++;correct++;$('feedback').textContent='✅ Para połączona!';header();if(matchPairs===matchItems.length){$('feedback').textContent=`🎉 Wszystkie pary połączone! Pomyłki: ${matchErrors}.`;action('Nowy zestaw par',()=>{newMatch();render()},'primary')}}else{matchErrors++;$('feedback').textContent='❌ To nie jest para. Spróbuj ponownie.';$('feedback').classList.add('error')}}})}) ;action('Nowe pary',()=>{newMatch();render()});}
function list(){let wrap=el('div',null,'tablewrap'),table=el('table',null,null,wrap),head=el('tr',null,null,table);names.forEach(n=>el('th',n,null,head));pool().forEach(r=>{let tr=el('tr',null,null,table);r.forEach(c=>el('td',c,null,tr))});action('Rozpocznij ćwiczenia',()=>{mode='fill';document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));start()},'primary')}
$('lesson').onchange=start;$('shuffle').onclick=start;document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));start()});start();
</script></body></html>
